name: Signed game startup compatibility

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: Public HTTPS APK URL or the verified APKMirror variant page
        required: true
        type: string
      source_profile:
        description: Published file metadata; publisher signature verification is always mandatory
        required: true
        type: choice
        default: apkmirror-203982
        options:
          - apkmirror-203982
          - apkpure-203982
      launch_offline:
        description: Launch the application once in the selected network mode
        required: true
        type: boolean
        default: true
      startup_network:
        description: Network mode for the bounded initial startup; no account input or login interaction
        required: true
        type: choice
        default: offline
        options:
          - offline
          - online
      verify_only:
        description: Download and diagnose the publisher APK signature on the host; skip Android
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-game-compatibility
  cancel-in-progress: true

jobs:
  offline-compatibility:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      APK_SOURCE_PROFILE: ${{ inputs.source_profile }}
      APK_VERIFY_ONLY: ${{ inputs.verify_only }}
      GAME_STARTUP_NETWORK: ${{ inputs.startup_network }}
    steps:
      - name: Check out source without persisting credentials
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify ephemeral runner and record capacity
        run: python3 tools/android-game-compat.py --phase before
      - name: Check certificate formats, network modes and route diagnostics
        run: python3 -m unittest discover -s tools/tests -p test_android_apk_diagnostics.py -v
      - name: Diagnose APK signature on the host without booting Android
        id: verifier
        if: ${{ inputs.verify_only }}
        env:
          APK_SOURCE_URL: ${{ inputs.apk_url }}
        run: python3 tools/android-game-compat.py --phase verify
      - name: Enable KVM only on the ephemeral GitHub runner
        if: ${{ !inputs.verify_only }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_ACTIONS:-}" == "true" ]]
          [[ "${RUNNER_ENVIRONMENT:-}" == "github-hosted" ]]
          [[ "${RUNNER_OS:-}" == "Linux" ]]
          [[ -c /dev/kvm ]]
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            sudo chmod a+rw /dev/kvm
          fi
          [[ -r /dev/kvm && -w /dev/kvm ]]
      - name: Verify signed APK and observe initial startup in selected network mode
        id: emulator
        if: ${{ !inputs.verify_only }}
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          APK_SOURCE_URL: ${{ inputs.apk_url }}
          ALLOW_OFFLINE_LAUNCH: ${{ inputs.launch_offline }}
        with:
          api-level: 35
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 4096M
          heap-size: 512M
          disk-size: 6G
          avd-name: signed-game-offline-test
          force-avd-creation: true
          channel: stable
          emulator-boot-timeout: 600
          disable-linux-hw-accel: false
          disable-animations: true
          emulator-options: -no-window -gpu software -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -accel on
          script: python3 tools/android-game-compat.py --phase game
      - name: Record final resource usage
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        env:
          COMPAT_EMULATOR_OUTCOME: ${{ steps.emulator.outcome }}
          COMPAT_VERIFY_OUTCOME: ${{ steps.verifier.outcome }}
        run: python3 tools/android-game-compat.py --phase after
      - name: Keep the bounded report and optional application screen for one day
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-game-offline-compatibility
          path: |
            artifacts/android-game-compat/report.json
            artifacts/android-game-compat/startup-game.png
          retention-days: 1
          if-no-files-found: warn
          compression-level: 6
