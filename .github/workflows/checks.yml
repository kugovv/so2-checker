name: Verify calculations, authorization and frontend
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/game_client/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: backend
      - run: pip install -r game_client/requirements.txt
        working-directory: backend
      - run: python -m pytest -q
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  mobile-ui:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: .pw-browsers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            tools/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm ci --prefix tools
      - run: node tools/node_modules/playwright/cli.js install --with-deps chromium
      - name: Start isolated frontend preview
        run: |
          npm run dev --prefix frontend -- --port 5173 > /tmp/so2-ui.log 2>&1 &
          curl --silent --fail --retry 20 --retry-connrefused --retry-delay 1 --output /dev/null http://127.0.0.1:5173
      - run: node tools/ui-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-ui-checks
          path: artifacts/ui/
